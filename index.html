<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>拒绝酒驾 · 平安回家</title>
<style>
  :root{
    --tabh: 62px;
    --gold:#ffd54f;
    --gold2:#ffb300;
    --gold3:#ff8f00;
    --muted:#7c8b9e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%, #1a2b4a 0%, #0d1b2a 45%, #060d18 100%);
    color:#fff;
    overflow:hidden;
  }

  /* ============ 布局骨架 ============ */
  .app{
    position:fixed; left:0; right:0; top:0;
    bottom:calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
    overflow:hidden;
  }
  .view{
    position:absolute; inset:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    opacity:0; visibility:hidden;
    transform:translateY(10px);
    transition:opacity .26s ease, transform .26s ease, visibility .26s;
    display:flex; flex-direction:column; align-items:center;
  }
  .view.active{opacity:1; visibility:visible; transform:none;}
  .vwrap{
    width:100%; min-height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 22px 28px;
  }
  #view-map.view{padding:0; overflow:hidden; display:block;}

  /* ============ 底部 Tab ============ */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0;
    height:calc(var(--tabh) + env(safe-area-inset-bottom, 0px));
    padding-bottom:env(safe-area-inset-bottom, 0px);
    display:flex;
    background:rgba(9,16,27,.94);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-top:1px solid rgba(255,255,255,.08);
    z-index:100;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:none; color:var(--muted);
    font-family:inherit; font-size:11px; letter-spacing:1px;
    cursor:pointer; transition:color .2s;
  }
  .tab .ic{font-size:20px; line-height:1; filter:grayscale(.5); transition:filter .2s;}
  .tab.active{color:var(--gold); font-weight:700;}
  .tab.active .ic{filter:none;}

  /* ============ 首页 ============ */
  .icon{font-size:52px; line-height:1; margin-bottom:18px; animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

  .title{
    font-size:clamp(28px,8.6vw,40px);
    font-weight:900; line-height:1.35; letter-spacing:2px;
    text-align:center;
    background:linear-gradient(180deg,#ffd54f 0%,#ffb300 60%,#ff8f00 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    filter:drop-shadow(0 0 26px rgba(255,180,0,.35));
    margin-bottom:16px;
  }
  .subtitle{
    font-size:16px; font-weight:600; letter-spacing:3px;
    color:#e8eef7; text-align:center; margin-bottom:34px;
  }
  .subtitle .highlight{color:var(--gold);}

  .btn-group{display:flex; flex-direction:column; gap:14px; width:100%; max-width:340px;}
  .btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:17px 0;
    font-size:17px; font-weight:700; letter-spacing:1.5px;
    color:#fff; border:none; border-radius:50px;
    font-family:inherit; cursor:pointer;
    transition:transform .15s ease, box-shadow .15s ease, filter .15s;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{transform:scale(.96); filter:brightness(1.08);}
  .btn .logo{font-size:20px;}
  .btn-amap{background:linear-gradient(135deg,#29b6f6 0%,#1e88e5 100%); box-shadow:0 8px 24px rgba(30,136,229,.42);}
  .btn-didi{background:linear-gradient(135deg,#ff9800 0%,#f4511e 100%); box-shadow:0 8px 24px rgba(244,81,30,.42);}

  .hint{
    font-size:12px; color:var(--muted); margin-top:14px;
    letter-spacing:1px; text-align:center;
  }

  .quick{display:flex; gap:12px; width:100%; max-width:340px; margin-top:30px;}
  .quick-card{
    flex:1; padding:16px 6px; border-radius:16px;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    color:#cfe0f5; font-family:inherit; font-size:13px; letter-spacing:1px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; transition:background .2s, transform .15s;
  }
  .quick-card:active{transform:scale(.96); background:rgba(255,255,255,.11);}
  .quick-card .ic{font-size:24px; line-height:1;}

  .footer{margin-top:34px; font-size:12px; color:#6c7c90; letter-spacing:2px; text-align:center;}
  .footer .strong{color:var(--gold); font-weight:700;}

  .emergency{display:flex; gap:12px; width:100%; max-width:340px; margin-top:20px;}
  .emergency-btn{
    flex:1; padding:12px 0; border-radius:50px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:#e8eef7; font-size:14px; font-weight:600; letter-spacing:1px;
    text-decoration:none; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:.2s;
  }
  .emergency-btn:active{background:rgba(255,82,82,.22); transform:scale(.96);}

  /* ============ 自测页 ============ */
  .view-title{font-size:22px; font-weight:800; letter-spacing:1px; margin-bottom:6px; text-align:center;}
  .view-sub{font-size:12px; color:var(--muted); letter-spacing:1px; margin-bottom:26px; text-align:center;}

  .field{width:100%; max-width:400px; margin-bottom:22px;}
  .field > label{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:13px; color:#9fb0c4; letter-spacing:1px; margin-bottom:11px;
  }
  .field label b{color:var(--gold); font-size:17px; font-weight:800;}

  .seg{display:flex; background:rgba(255,255,255,.06); border-radius:13px; padding:4px;}
  .seg-btn{
    flex:1; padding:11px 0; border:none; background:transparent;
    color:#9fb0c4; font-family:inherit; font-size:15px; font-weight:600;
    border-radius:10px; cursor:pointer; transition:.2s;
  }
  .seg-btn.active{background:linear-gradient(135deg,#ffd54f,#ffb300); color:#1a1200; font-weight:800;}

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:100%; height:6px; border-radius:3px;
    background:rgba(255,255,255,.14);
    outline:none; display:block;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:24px; height:24px; border-radius:50%;
    background:#fff; border:3px solid var(--gold2);
    box-shadow:0 3px 10px rgba(0,0,0,.55); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%;
    background:#fff; border:3px solid var(--gold2); cursor:pointer;
  }

  .drink-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
  .drink{
    padding:13px 6px; border-radius:14px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:#cfe0f5; font-family:inherit; font-size:14px; font-weight:600;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    cursor:pointer; transition:.2s; letter-spacing:.5px;
  }
  .drink .ic{font-size:20px; line-height:1.2;}
  .drink small{font-size:10px; color:var(--muted); font-weight:400; letter-spacing:0;}
  .drink.active{
    border-color:var(--gold);
    background:rgba(255,213,79,.13);
    color:var(--gold);
  }
  .drink.active small{color:rgba(255,213,79,.65);}

  .stepper{
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(255,255,255,.06); border-radius:15px; padding:6px;
  }
  .stepper button{
    width:48px; height:46px; border-radius:11px; border:none;
    background:rgba(255,255,255,.08); color:#fff;
    font-size:22px; font-family:inherit; line-height:1;
    cursor:pointer; transition:.15s;
  }
  .stepper button:active{background:rgba(255,213,79,.3); transform:scale(.94);}
  .stepper b{font-size:22px; color:var(--gold); min-width:70px; text-align:center; font-weight:800;}

  .btn-primary{
    background:linear-gradient(135deg,#ffd54f 0%,#ff9800 100%);
    color:#1a1200; font-weight:900;
    box-shadow:0 8px 26px rgba(255,152,0,.4);
    max-width:400px; margin-top:4px;
  }

  /* 结果卡片 */
  .result{
    width:100%; max-width:400px; margin-top:24px;
    padding:24px 20px 20px; border-radius:20px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    display:none; text-align:center;
  }
  .result.show{display:block; animation:pop .32s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{opacity:0; transform:scale(.94) translateY(8px);} to{opacity:1; transform:none;}}

  .result-num{display:flex; align-items:baseline; justify-content:center; gap:6px; margin-bottom:6px;}
  .result-num b{font-size:46px; font-weight:900; line-height:1; letter-spacing:-1px;}
  .result-num span{font-size:12px; color:var(--muted); letter-spacing:1px;}

  .result-tag{
    display:inline-block; padding:6px 16px; border-radius:30px;
    font-size:13px; font-weight:700; letter-spacing:1px; margin-bottom:18px;
  }
  .lv-safe   .result-num b{color:#4ade80;}
  .lv-safe   .result-tag{background:rgba(74,222,128,.15); color:#4ade80;}
  .lv-warn   .result-num b{color:#ffa726;}
  .lv-warn   .result-tag{background:rgba(255,167,38,.15); color:#ffa726;}
  .lv-danger .result-num b{color:#ff5252;}
  .lv-danger .result-tag{background:rgba(255,82,82,.15); color:#ff5252;}

  .bar-wrap{position:relative; height:8px; border-radius:4px; background:rgba(255,255,255,.1); margin-bottom:8px; overflow:hidden;}
  .bar-fill{height:100%; width:0; border-radius:4px; transition:width .5s cubic-bezier(.3,1,.4,1), background .3s;}
  .bar-marks{position:relative; height:16px; margin-bottom:16px; font-size:10px; color:var(--muted);}
  .bar-marks span{position:absolute; transform:translateX(-50%); white-space:nowrap;}

  .result-desc{font-size:13px; line-height:1.75; color:#b9c8dc; text-align:left; letter-spacing:.3px;}
  .result-desc b{color:var(--gold);}

  .result-extra{
    margin-top:14px; padding-top:14px;
    border-top:1px dashed rgba(255,255,255,.12);
    font-size:12.5px; line-height:1.7; color:#93a5ba; text-align:left;
  }
  .result-extra b{color:var(--gold); font-size:14px;}

  .disclaimer{
    margin-top:16px; font-size:11px; line-height:1.7;
    color:#66778c; text-align:left;
    padding:10px 12px; border-radius:10px;
    background:rgba(255,255,255,.035);
  }

  .btn-rescue{
    margin-top:16px;
    background:linear-gradient(135deg,#ff9800,#f4511e);
    box-shadow:0 8px 24px rgba(244,81,30,.4);
  }

  /* ============ 地图页 ============ */
  #stage{
    position:absolute; inset:0;
    overflow:hidden; touch-action:none;
    background:
      radial-gradient(circle at 50% 40%, #12233a 0%, #08111e 100%);
    cursor:grab;
  }
  #stage:active{cursor:grabbing;}
  #mapImg{
    position:absolute; left:0; top:0;
    transform-origin:0 0;
    will-change:transform;
    display:block;
    max-width:none; max-height:none;
    -webkit-user-select:none; user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;
  }
  .map-controls{
    position:absolute; right:14px; bottom:22px;
    display:flex; flex-direction:column; gap:10px; z-index:5;
  }
  .map-btn{
    width:44px; height:44px; border-radius:13px;
    background:rgba(10,20,34,.82);
    border:1px solid rgba(255,255,255,.16);
    color:#fff; font-size:20px; line-height:1; font-family:inherit;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:.15s;
  }
  .map-btn:active{background:rgba(255,213,79,.25); transform:scale(.93);}

  .map-tip{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    padding:7px 16px; border-radius:30px;
    background:rgba(10,20,34,.75);
    border:1px solid rgba(255,255,255,.12);
    font-size:11.5px; color:#9fb0c4; letter-spacing:1px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    z-index:5; white-space:nowrap; pointer-events:none;
    transition:opacity .4s;
  }
  .map-tip.hide{opacity:0;}

  /* 地图缺失提示层 */
  .map-missing{
    position:absolute; inset:0;
    display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; color:#5c6d82; font-size:13px; line-height:1.9;
    letter-spacing:1px; text-align:center; padding:30px;
    z-index:3; pointer-events:none;
  }
  .map-missing.show{display:flex;}
  .map-missing b{color:var(--gold);}
  .map-missing .go-choose{
    pointer-events:auto;
    margin-top:8px;
    padding:11px 22px; border-radius:30px;
    background:linear-gradient(135deg,#ffd54f,#ffb300);
    color:#1a1200; font-weight:800; font-size:14px;
    border:none; font-family:inherit; letter-spacing:1px;
    cursor:pointer;
  }

  /* ============ Toast ============ */
  #toast{
    position:fixed; left:50%; bottom:calc(var(--tabh) + 44px);
    transform:translate(-50%,12px);
    background:rgba(0,0,0,.88);
    color:#fff; padding:13px 20px; border-radius:13px;
    font-size:13px; line-height:1.6; max-width:82vw; text-align:center;
    opacity:0; pointer-events:none; transition:.26s; z-index:999;
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}
</style>
</head>
<body>

<div class="app">

  <!-- ================= 首页 ================= -->
  <section class="view active" id="view-home">
    <div class="vwrap">
      <div class="icon">🚫🍷</div>
      <h1 class="title">今晚这杯酒<br>别带到车里</h1>
      <p class="subtitle">喝酒不开车，开车<span class="highlight">找代驾</span></p>

      <div class="btn-group">
        <button class="btn btn-amap" data-app="amap">
          <span class="logo">🗺️</span> 打开高德地图叫代驾
        </button>
        <button class="btn btn-didi" data-app="didi">
          <span class="logo">🚗</span> 打开滴滴叫代驾
        </button>
      </div>
      <p class="hint">打开 App 后请点击首页的「代驾」入口</p>

      <div class="quick">
        <button class="quick-card" data-goto="calc">
          <span class="ic">🧪</span><span>酒精自测</span>
        </button>
        <button class="quick-card" data-goto="map">
          <span class="ic">🗺️</span><span>风险地图</span>
        </button>
      </div>

      <div class="emergency">
        <a class="emergency-btn" href="tel:122">🚨 122 事故报警</a>
        <a class="emergency-btn" href="tel:110">🚔 110 报警</a>
      </div>

      <p class="footer">安全是回家最近的路 · <span class="strong">拒绝酒驾</span></p>
    </div>
  </section>

  <!-- ================= 自测 ================= -->
  <section class="view" id="view-calc">
    <div class="vwrap">
      <h2 class="view-title">酒精摄入自测</h2>
      <p class="view-sub">基于 Widmark 公式估算 · 仅供参考</p>

      <div class="field">
        <label>体重 <b><span id="weight-val">70</span> kg</b></label>
        <input type="range" id="weight" min="40" max="120" step="1" value="70">
      </div>

      <div class="field">
        <label>喝了什么</label>
        <div class="drink-grid" id="drink-grid"></div>
      </div>

      <div class="field">
        <label>喝了多少 <b><span id="cups">1</span> <span id="cup-unit">瓶</span></b></label>
        <div class="stepper">
          <button id="btn-minus" type="button">−</button>
          <b id="cups-big">1</b>
          <button id="btn-plus" type="button">+</button>
        </div>
      </div>

      <div class="field">
        <label>距离喝完最后一杯 <b><span id="hours-val">1</span> 小时</b></label>
        <input type="range" id="hours" min="0" max="12" step="0.5" value="1">
      </div>

      <button class="btn btn-primary" id="btn-calc">开始测算</button>

      <div class="result" id="result">
        <div class="result-num">
          <b id="bac-val">0</b><span>mg/100mL</span>
        </div>
        <div class="result-tag" id="bac-tag"></div>

        <div class="bar-wrap"><div class="bar-fill" id="bar-fill"></div></div>
        <div class="bar-marks">
          <span style="left:13.3%">酒驾 20</span>
          <span style="left:53.3%">醉驾 80</span>
        </div>

        <p class="result-desc" id="bac-desc"></p>
        <div class="result-extra" id="bac-extra"></div>

        <button class="btn btn-rescue" data-app="amap" id="btn-rescue">🚗 立即叫代驾</button>

        <p class="disclaimer">
          ⚠️ 本结果依据 Widmark 公式估算，受饮酒速度、空腹状态、肝功能、个体代谢差异等因素影响，可能与实际检测值存在偏差，<b>不作为法律依据</b>。唯一安全的选择是：<b>不开车</b>。
        </p>
      </div>
    </div>
  </section>

  <!-- ================= 地图 ================= -->

<script>
(function () {
  'use strict';

  /* =========================================================
     0. 工具
  ========================================================= */
  var $ = function (id) { return document.getElementById(id); };

  function showToast(msg) {
    var t = $('toast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'toast';
      document.body.appendChild(t);
    }
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 2800);
  }

  function paintRange(el) {
    var min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
    var p = (v - min) / (max - min) * 100;
    el.style.background = 'linear-gradient(90deg,#ffd54f 0%,#ffb300 ' + p + '%,rgba(255,255,255,.14) ' + p + '%,rgba(255,255,255,.14) 100%)';
  }

  /* =========================================================
     1. 视图切换
  ========================================================= */
  var tabs  = document.querySelectorAll('.tab');
  var views = document.querySelectorAll('.view');

  function goto(name) {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.view === name); });
    views.forEach(function (v) { v.classList.toggle('active', v.id === 'view-' + name); });
    if (name === 'map') {
      setTimeout(function () { relayout(); }, 60);
    }
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () { goto(t.dataset.view); });
  });
  document.querySelectorAll('[data-goto]').forEach(function (b) {
    b.addEventListener('click', function () { goto(b.dataset.goto); });
  });

  /* =========================================================
     2. 一键叫代驾（deeplink）
  ========================================================= */
  var AMAP_FALLBACK = 'https://ditu.amap.com/';
  var DIDI_FALLBACK = 'https://common.diditaxi.com.cn/';

  function launch(scheme, intentUrl, fallback, timeout) {
    var ua = navigator.userAgent;
    var isAndroid = /Android/i.test(ua);
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (/MicroMessenger|QQ\//i.test(ua)) {
      showToast('微信内无法直接唤起 App<br>请点右上角「···」→「在浏览器中打开」');
      return;
    }

    if (isAndroid && intentUrl) {
      window.location.href = intentUrl;
      return;
    }

    if (isIOS) {
      var left = false;
      var onHide = function () { if (document.hidden || document.webkitHidden) left = true; };
      document.addEventListener('visibilitychange', onHide);
      document.addEventListener('webkitvisibilitychange', onHide);

      var ifr = document.createElement('iframe');
      ifr.style.cssText = 'display:none;width:0;height:0;border:0;position:absolute;';
      ifr.src = scheme;
      document.body.appendChild(ifr);

      setTimeout(function () {
        document.removeEventListener('visibilitychange', onHide);
        document.removeEventListener('webkitvisibilitychange', onHide);
        if (ifr.parentNode) ifr.parentNode.removeChild(ifr);
        if (!left && !document.hidden) {
          window.location.href = fallback;
        }
      }, timeout || 2200);
      return;
    }

    window.open(fallback, '_blank');
  }

  function openAmap() {
    var ua = navigator.userAgent;
    var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var scheme = isIOS ? 'iosamap://' : 'androidamap://';
    var intent = 'intent://#Intent;scheme=androidamap;package=com.autonavi.minimap;' +
                 'S.browser_fallback_url=' + encodeURIComponent(AMAP_FALLBACK) + ';end';
    launch(scheme, intent, AMAP_FALLBACK, 2200);
  }

  function openDidi() {
    var scheme = 'didi://';
    var intent = 'intent://#Intent;scheme=didi;package=com.sdu.didi.psnger;' +
                 'S.browser_fallback_url=' + encodeURIComponent(DIDI_FALLBACK) + ';end';
    launch(scheme, intent, DIDI_FALLBACK, 2200);
  }

  document.querySelectorAll('[data-app]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var app = btn.dataset.app;
      if (app === 'amap') openAmap();
      else if (app === 'didi') openDidi();
    });
  });

  /* =========================================================
     3. 可缩放地图
  ========================================================= */
  var stage = $('stage');
  var mapImg = $('mapImg');
  var mapMissing = $('mapMissing');
  var mapFile = $('mapFile');

  var natW = 0, natH = 0;
  var dispW = 0, dispH = 0;
  var baseL = 0, baseT = 0;
  var s = 1, tx = 0, ty = 0;
  var MAXS = 6;
  var mapReady = false;

  function applyTransform() {
    mapImg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')';
  }

  function clampTransform() {
    var sw = stage.clientWidth, sh = stage.clientHeight;
    var vw = dispW * s, vh = dispH * s;

    if (vw <= sw) {
      tx = (sw - vw) / 2 - baseL;
    } else {
      tx = Math.min(-baseL, Math.max(sw - vw - baseL, tx));
    }
    if (vh <= sh) {
      ty = (sh - vh) / 2 - baseT;
    } else {
      ty = Math.min(-baseT, Math.max(sh - vh - baseT, ty));
    }
  }

  function fitMap() {
    var sw = stage.clientWidth, sh = stage.clientHeight;
    if (!sw || !sh || !natW) return;
    var k = Math.min(sw / natW, sh / natH);
    dispW = natW * k;
    dispH = natH * k;
    baseL = (sw - dispW) / 2;
    baseT = (sh - dispH) / 2;

    mapImg.style.width = dispW + 'px';
    mapImg.style.height = dispH + 'px';
    mapImg.style.left = baseL + 'px';
    mapImg.style.top = baseT + 'px';

    s = 1; tx = 0; ty = 0;
    applyTransform();
  }

  function relayout() {
    if (!mapReady) return;
    fitMap();
  }

  function zoomTo(newS, cx, cy) {
    newS = Math.max(1, Math.min(MAXS, newS));
    var px = (cx - baseL - tx) / s;
    var py = (cy - baseT - ty) / s;
    s = newS;
    tx = cx - baseL - px * s;
    ty = cy - baseT - py * s;
    clampTransform();
    applyTransform();
  }

  function mapCenter() {
    return { x: stage.clientWidth / 2, y: stage.clientHeight / 2 };
  }

  function onImgReady() {
    natW = mapImg.naturalWidth;
    natH = mapImg.naturalHeight;
    if (!natW || !natH) return;
    mapReady = true;
    mapMissing.classList.remove('show');
    fitMap();
  }

  mapImg.addEventListener('load', onImgReady);

  function onImgError() {
    mapReady = false;
    natW = natH = 0;
    mapMissing.classList.add('show');
  }
  mapImg.addEventListener('error', onImgError);

  if (mapImg.complete) {
    if (mapImg.naturalWidth) onImgReady();
    else onImgError();
  }

  // 选择本地地图图片
  function chooseMap() {
    if (mapFile) mapFile.click();
  }
  $('btn-choose-map').addEventListener('click', chooseMap);

  if (mapFile) {
    mapFile.addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (!f) return;
      if (!/^image\//.test(f.type)) {
        showToast('请选择图片文件');
        return;
      }
      var reader = new FileReader();
      reader.onload = function (ev) {
        mapImg.src = ev.target.result;
      };
      reader.readAsDataURL(f);
      this.value = '';
    });
  }

  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', function () { setTimeout(relayout, 250); });

  // ---- 手势 ----
  var pts = new Map();
  var gest = null;
  var lastTap = 0, lastTapX = 0, lastTapY = 0;

  function stagePos(e) {
    var r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  stage.addEventListener('pointerdown', function (e) {
    if (!mapReady) return;

    if (pts.size === 0) {
      var now = Date.now();
      if (now - lastTap < 300 &&
          Math.abs(e.clientX - lastTapX) < 32 &&
          Math.abs(e.clientY - lastTapY) < 32) {
        var p = stagePos(e);
        zoomTo(s > 1.3 ? 1 : 2.6, p.x, p.y);
        lastTap = 0;
        return;
      }
      lastTap = now;
      lastTapX = e.clientX;
      lastTapY = e.clientY;
    }

    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pts.size === 1) {
      gest = { mode: 'pan', sx: e.clientX, sy: e.clientY, tx0: tx, ty0: ty };
    } else if (pts.size === 2) {
      var arr = Array.from(pts.values());
      var a = arr[0], b = arr[1];
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var r = stage.getBoundingClientRect();
      gest = {
        mode: 'pinch',
        d0: Math.hypot(a.x - b.x, a.y - b.y),
        s0: s,
        cx: (mx - r.left - baseL - tx) / s,
        cy: (my - r.top - baseT - ty) / s
      };
    }
  });

  stage.addEventListener('pointermove', function (e) {
    if (!mapReady) return;
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!gest) return;

    if (gest.mode === 'pan' && pts.size === 1) {
      tx = gest.tx0 + (e.clientX - gest.sx);
      ty = gest.ty0 + (e.clientY - gest.sy);
      clampTransform();
      applyTransform();

    } else if (gest.mode === 'pinch' && pts.size === 2) {
      var arr = Array.from(pts.values());
      var a = arr[0], b = arr[1];
      var d = Math.hypot(a.x - b.x, a.y - b.y);
      var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      var ns = Math.max(1, Math.min(MAXS, gest.s0 * d / gest.d0));
      var r = stage.getBoundingClientRect();

      s = ns;
      tx = (mx - r.left) - baseL - gest.cx * s;
      ty = (my - r.top) - baseT - gest.cy * s;
      clampTransform();
      applyTransform();
    }
  });

  function endPointer(e) {
    pts.delete(e.pointerId);
    if (pts.size === 1) {
      var p = Array.from(pts.values())[0];
      gest = { mode: 'pan', sx: p.x, sy: p.y, tx0: tx, ty0: ty };
    } else if (pts.size === 0) {
      gest = null;
    }
  }
  stage.addEventListener('pointerup', endPointer);
  stage.addEventListener('pointercancel', endPointer);
  stage.addEventListener('pointerleave', function (e) {
    if (pts.has(e.pointerId) && e.pointerType === 'mouse') endPointer(e);
  });

  stage.addEventListener('wheel', function (e) {
    if (!mapReady) return;
    e.preventDefault();
    var p = stagePos(e);
    zoomTo(s * (e.deltaY < 0 ? 1.14 : 0.88), p.x, p.y);
  }, { passive: false });

  $('zoom-in').addEventListener('click', function () {
    if (!mapReady) return;
    var c = mapCenter(); zoomTo(s * 1.5, c.x, c.y);
  });
  $('zoom-out').addEventListener('click', function () {
    if (!mapReady) return;
    var c = mapCenter(); zoomTo(s / 1.5, c.x, c.y);
  });
  $('zoom-reset').addEventListener('click', function () {
    if (!mapReady) return;
    fitMap();
  });

  // 3 秒后自动隐藏提示
  setTimeout(function () {
    var tip = $('map-tip');
    if (tip) tip.classList.add('hide');
  }, 3500);

  /* =========================================================
     4. 酒精自测
  ========================================================= */
  var DRINKS = [
    { icon: '🍺', name: '啤酒', vol: 500, abv: 4,  unit: '瓶' },
    { icon: '🍷', name: '红酒', vol: 150, abv: 12, unit: '杯' },
    { icon: '🥃', name: '白酒', vol: 50,  abv: 52, unit: '两' },
    { icon: '🍸', name: '洋酒', vol: 40,  abv: 40, unit: '杯' }
  ];

  var state = {
    r: 0.68,
    weight: 70,
    drink: DRINKS[0],
    cups: 1,
    hours: 1
  };

  var drinkGrid = $('drink-grid');
  DRINKS.forEach(function (d, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'drink' + (i === 0 ? ' active' : '');
    b.innerHTML = '<span class="ic">' + d.icon + '</span>' +
                  '<span>' + d.name + '</span>' +
                  '<small>' + d.vol + 'ml · ' + d.abv + '%vol</small>';
    b.addEventListener('click', function () {
      drinkGrid.querySelectorAll('.drink').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      state.drink = d;
      state.cups = 1;
      $('cups').textContent = '1';
      $('cups-big').textContent = '1';
      $('cup-unit').textContent = d.unit;
    });
    drinkGrid.appendChild(b);
  });

  var weightEl = $('weight');
  weightEl.addEventListener('input', function () {
    state.weight = parseFloat(this.value);
    $('weight-val').textContent = this.value;
    paintRange(this);
  });
  paintRange(weightEl);

  function setCups(n) {
    state.cups = Math.max(1, Math.min(30, n));
    $('cups').textContent = state.cups;
    $('cups-big').textContent = state.cups;
  }
  $('btn-minus').addEventListener('click', function () { setCups(state.cups - 1); });
  $('btn-plus').addEventListener('click', function () { setCups(state.cups + 1); });

  var hoursEl = $('hours');
  hoursEl.addEventListener('input', function () {
    state.hours = parseFloat(this.value);
    $('hours-val').textContent = this.value;
    paintRange(this);
  });
  paintRange(hoursEl);

  function calculate() {
    var d = state.drink;
    var pureAlcohol = d.vol * state.cups * (d.abv / 100) * 0.789;
    var peak = pureAlcohol / (state.r * state.weight) * 100;
    var bac = Math.max(0, peak - 15 * state.hours);

    var level, tag, desc;
    if (bac >= 80) {
      level = 'lv-danger';
      tag = '⚠️ 已达醉酒驾驶标准';
      desc = '血液酒精含量 ≥ <b>80mg/100mL</b> 属于醉酒驾驶，构成危险驾驶罪，将依法追究刑事责任。此时反应能力与判断力严重下降，<b>绝对不能开车</b>。';
    } else if (bac >= 20) {
      level = 'lv-warn';
      tag = '⚠️ 已达饮酒驾驶标准';
      desc = '血液酒精含量 ≥ <b>20mg/100mL</b> 属于饮酒后驾驶机动车，将面临暂扣驾驶证、罚款等处罚。<b>请勿开车</b>。';
    } else if (bac > 0) {
      level = 'lv-safe';
      tag = '✓ 未达酒驾标准';
      desc = '估算值未达到法定酒驾标准（20mg/100mL），但酒精仍会降低反应速度与注意力，<b>建议不要驾车</b>。';
    } else {
      level = 'lv-safe';
      tag = '✓ 估算已基本代谢';
      desc = '按估算酒精已代谢完毕，但个体差异较大，请以自身真实状态为准，<b>感觉不适就不要开车</b>。';
    }

    var t20 = peak > 20 ? (peak - 20) / 15 : 0;
    var remain = Math.max(0, t20 - state.hours);
    var extraText;
    if (remain > 0.02) {
      var totalMin = Math.ceil(remain * 60);
      var hh = Math.floor(totalMin / 60);
      var mm = totalMin % 60;
      var arrive = new Date(Date.now() + remain * 3600000);
      var arriveStr = arrive.getHours() + ':' + String(arrive.getMinutes()).padStart(2, '0');
      extraText = '⏱ 按每小时代谢约 15mg/100mL 估算，最早 <b>' + arriveStr + '</b>' +
                  '（还需 ' + (hh > 0 ? hh + ' 小时 ' : '') + mm + ' 分钟）才能降至酒驾标准以下。';
    } else {
      extraText = '⏱ 估算当前已低于酒驾标准，但仍请谨慎判断自身状态。';
    }

    var box = $('result');
    box.className = 'result show ' + level;
    $('bac-val').textContent = bac.toFixed(1);
    $('bac-tag').textContent = tag;
    $('bac-desc').innerHTML = desc;

    var pct = Math.min(100, bac / 150 * 100);
    var fill = $('bar-fill');
    fill.style.width = pct + '%';
    fill.style.background = bac >= 80 ? 'linear-gradient(90deg,#ff5252,#d32f2f)' :
                            bac >= 20 ? 'linear-gradient(90deg,#ffb300,#f4511e)' :
                                        'linear-gradient(90deg,#4ade80,#22c55e)';

    $('bac-extra').innerHTML =
      extraText +
      '<br>🍶 本次共摄入纯酒精约 <b>' + pureAlcohol.toFixed(1) + ' 克</b>' +
      '<br>📊 估算峰值浓度约 <b>' + peak.toFixed(1) + ' mg/100mL</b>';

    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  $('btn-calc').addEventListener('click', calculate);

})();
</script>
</body>
</html>
